name: CI (dev-unstable)

on:
  push:
    branches: [ dev-unstable ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install babashka
        run: |
          curl -sLo bb.tar.gz \
          https://github.com/babashka/babashka/releases/download/v1.3.189/babashka-1.3.189-linux-amd64.tar.gz
          sudo tar -xzf bb.tar.gz -C /usr/local/bin bb
          bb --version

      - name: Install clj-kondo
        run: |
          curl -sLo clj-kondo.zip \
          https://github.com/clj-kondo/clj-kondo/releases/download/v2024.09.27/clj-kondo-2024.09.27-linux-amd64.zip
          sudo unzip -o clj-kondo.zip -d /usr/local
          clj-kondo --version

      - name: Generate with CLJS DSL
        run: bb build:gen

      - name: Build (BASE_PATH for preview artifacts)
        env:
          BASE_PATH: /foolsgoldtoshi-star-nixtaveganic-corn
        run: bb build:bundle

      - name: Lint & format-check
        run: |
          bb lint:kondo
          bb fmt:check

      - name: Upload static artifact (no deploy)
        uses: actions/upload-artifact@v4
        with:
          name: dev-unstable-build
          path: web/build
