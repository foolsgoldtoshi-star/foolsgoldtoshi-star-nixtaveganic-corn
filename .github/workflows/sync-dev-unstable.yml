name: Sync dev-unstable from highvalley-wake

on:
  push:
    branches: [ highvalley-wake ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: highvalley-wake
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Push state to dev-unstable (force update)
        run: |
          git fetch origin dev-unstable || true
          git push origin HEAD:dev-unstable --force
