name: Pages (highvalley-wake)

on:
  push:
    branches: [ highvalley-wake ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        # needed for SvelteKit + shadow-cljs execution
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (for shadow-cljs)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install babashka
        run: |
          curl -sLo bb.tar.gz \
          https://github.com/babashka/babashka/releases/download/v1.3.189/babashka-1.3.189-linux-amd64.tar.gz
          sudo tar -xzf bb.tar.gz -C /usr/local/bin bb
          bb --version

      - name: Install clj-kondo
        run: |
          curl -sLo clj-kondo.zip \
          https://github.com/clj-kondo/clj-kondo/releases/download/v2024.09.27/clj-kondo-2024.09.27-linux-amd64.zip
          sudo unzip -o clj-kondo.zip -d /usr/local
          clj-kondo --version

      - name: Generate pages from CLJS DSL
        run: bb build:gen

      - name: Build SvelteKit
        env:
          BASE_PATH: /foolsgoldtoshi-star-nixtaveganic-corn
        run: bb build:bundle

      - name: Lint & format-check
        run: |
          bb lint:kondo
          bb fmt:check

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
