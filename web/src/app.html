<!doctype html>
<html lang="%sveltekit.lang%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="NixtaVeganic Corn - Ecological farm documentation system" />
		<meta name="theme-color" content="#4a7c59" />
		
		<!-- Warm theme system -->
		<meta name="color-scheme" content="light dark" />
		
		<!-- Open Graph for social sharing -->
		<meta property="og:title" content="🌽 NixtaVeganic Corn" />
		<meta property="og:description" content="Ecological, no-till, veganic field corn with on-site nixtamalization" />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://foolsgoldtoshi-star.github.io/foolsgoldtoshi-star-nixtaveganic-corn/" />
		
		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:title" content="🌽 NixtaVeganic Corn" />
		<meta name="twitter:description" content="Functional farm documentation system" />
		
		%sveltekit.head%
		
		<!-- Initialize theme before page load to prevent flash -->
		<script>
			// Prevent flash of incorrect theme
			(function() {
				const theme = localStorage.getItem('theme') || 
					(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
				document.documentElement.setAttribute('data-theme', theme);
			})();
		</script>
	</head>
	<body data-sveltekit-preload-data="hover" class="fade-in">
		<div style="display: contents">%sveltekit.body%</div>
		
		<!-- Warm loading indicator -->
		<style>
			.fade-in {
				animation: fadeIn 0.5s ease-in-out;
			}
			@keyframes fadeIn {
				from { opacity: 0; }
				to { opacity: 1; }
			}
			
			/* Loading state */
			body:not(.hydrated) {
				cursor: wait;
			}
		</style>
	</body>
</html>
